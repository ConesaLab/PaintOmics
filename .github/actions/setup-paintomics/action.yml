name: Set up PaintOmics for a pipeline job
description: >-
  Python 3.11 with the pinned requirements, R with the metagene/hub packages,
  a local MongoDB restored from the cached species snapshot, the runtime
  KEGG_DATA subset, the example GTF and the more-rs binary. Everything is
  cached; nothing here reads a secret. Runs on macos-26 (arm64), the platform
  family the regression baseline was produced on.

inputs:
  data-snapshot:
    description: Cache key suffix of the species-data snapshot (seeded by data-cache.yml)
    required: false
    default: v1-kegg20260813
  r-version:
    description: R version (the baseline ran on 4.6.0)
    required: false
    default: "4.6.0"

runs:
  using: composite
  steps:
    - name: Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt

    # cairocffi (behind CairoSVG, which renders the pathway exports) dlopens
    # libcairo at import time; the runner image does not ship it.
    - name: cairo
      shell: bash
      run: |
        brew list cairo >/dev/null 2>&1 || brew install --quiet cairo
        # Homebrew's lib dir is not on dyld's default search path on Apple
        # silicon, so cairocffi's dlopen("libcairo.2.dylib") still failed
        # after the install; the fallback path is what ctypes consults.
        echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

    - name: Python requirements
      shell: bash
      run: python -m pip install --quiet -r requirements.txt

    - name: R ${{ inputs.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}

    # Not r-lib/actions/setup-r-dependencies: it installed these same
    # packages in 20 s and then sat for eight minutes in its "check whether
    # quarto is needed" step, which was the entire PR budget.
    - name: R package library (cache)
      uses: actions/cache@v6
      with:
        path: ~/paintomics-ci/Rlib
        key: r-packages-${{ inputs.r-version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/setup-r-packages.sh') }}

    - name: R packages for the metagene and hub scripts
      shell: bash
      run: scripts/ci/setup-r-packages.sh

    - name: MongoDB distribution (cache)
      uses: actions/cache@v6
      with:
        path: ~/paintomics-ci/mongodb-dist
        key: mongodb-macos-arm64-8.2.9-tools-100.16.1

    - name: Start MongoDB
      shell: bash
      run: scripts/ci/setup-mongo.sh

    - name: Species data snapshot (cache, seeded by data-cache.yml)
      uses: actions/cache/restore@v6
      with:
        path: ~/paintomics-ci/data
        key: paintomics-ci-data-${{ inputs.data-snapshot }}
        fail-on-cache-miss: true

    - name: Restore species data, KEGG_DATA and the example GTF
      shell: bash
      run: scripts/ci/restore-data.sh ~/paintomics-ci/data

    # Keyed on the build script's own hash, not on a copy of the commit it
    # pins. The commit used to be written out here as well, and the two went
    # out of step the first time the pin moved: the cache restored the old
    # binary under a key naming it, build-more-rs.sh looked for the new one,
    # missed, rebuilt it, and then saved it back under the stale key -- so
    # every run rebuilt from scratch while the key claimed otherwise. Hashing
    # the script cannot drift from it. The cost is that editing a comment in
    # that file also busts the cache, which is one rebuild.
    - name: more-rs binary (cache)
      uses: actions/cache@v6
      with:
        path: ~/paintomics-ci/more-rs
        key: more-rs-${{ hashFiles('scripts/ci/build-more-rs.sh') }}-${{ runner.os }}-${{ runner.arch }}

    - name: more-rs
      shell: bash
      run: scripts/ci/build-more-rs.sh

    - name: Server configuration from the template
      shell: bash
      run: |
        cp PaintomicsServer/src/resources/example_serverconf.py PaintomicsServer/src/conf/serverconf.py
        mkdir -p PaintomicsServer/src/log
        echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"

# Dependabot configuration.
#
# The pip manifest is `/requirements.txt`, and it is the only one in the tree.
# `PaintomicsServer/src/requirements.txt` used to be a second, conflicting copy
# (CairoSVG 2.4.2 vs 2.7.0, Pillow 8.0.1 vs 10.3.0). It was first reduced to a
# bare `-r ../../requirements.txt` include and then deleted outright on
# 2026-08-11: GitHub's dependency graph cannot parse a manifest that only
# includes another one, so it kept serving the last snapshot it had managed to
# read — the 2020 pins — and raised 33 Dependabot alerts against versions
# nothing had installed for months. `PaintomicsServer/src/tests/
# test_dependencies_declared.py` now enforces that a second manifest does not
# come back, so pointing pip at "/" is enough and adding another directory here
# would recreate the problem.
#
# The pins in requirements.txt are deliberate — the comment at the top of that
# file explains which ones hold the interpreter at Python 3.11 and why. Read it
# before merging a major bump; a green PR here is not evidence that the
# scientific stack still behaves the same.
#
# `/.python-version` at the repository root is what tells dependabot the
# interpreter is 3.11. Without it dependabot resolves against the newest Python
# it knows, and the first pip group it opened proposed `numpy==2.5.2`, which
# declares `Requires-Python >= 3.12` and so cannot install here at all: the
# whole pull request died at `pip install` before one test ran (#118, run
# 33437005065). numpy was not the only casualty of that miss, only the first
# one pip reached — `scipy==1.18.1` in the same group also requires 3.12 and
# publishes no cp311 wheel.
#
# Updates are grouped so that a week produces one pull request per ecosystem
# rather than a dozen.
#
# Splitting each ecosystem in two on `update-types` — a patch/minor pull
# request that merges on a green gate, a major one reviewed on purpose — was
# tried and rejected, because requirements.txt pins every package with `==` and
# those pins constrain each other across exactly that boundary:
#
#   * `openai-agents` 0.8.4 -> 0.22.0 keeps its leading zero, so dependabot
#     calls it a minor, but 0.22.0 requires `openai>=3.0.0,<4` — and `openai`
#     2.25.0 -> 3.x is a major, in the other group.
#   * The newest numpy for 3.11 is 2.4.6, a major; `scipy` 1.13.1, which would
#     stay behind in the minor group, requires `numpy<2.3`.
#
# Each half would install a package whose own dependency is pinned in the other
# half, so both pull requests would end at `ResolutionImpossible` — #118 twice
# over instead of not at all. One group per ecosystem keeps the set consistent;
# the interpreter pin above is what stops an unusable member from being
# proposed in the first place.

version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python:
        patterns:
          - "*"
    ignore:
      # chardet 6 and 7 replaced the 5.x scoring model, and the new one guesses
      # a Central-European or hp-roman8 codec at ~0.05 confidence where 5.2.0
      # guessed ISO-8859-1 at 0.73. Util.ensure_utf8 trusts the guess and those
      # codecs accept every byte, so it never reaches its cp1252/latin-1
      # fallback: a latin-1 omics upload is rewritten in place as mojibake and
      # the function reports success. Six of seventeen accented rows corrupted
      # in the measurement recorded on the pin in requirements.txt. No suite
      # catches it, so without this the group would re-propose it every week.
      # Drop this entry together with a detection test for latin-1 tables.
      - dependency-name: "chardet"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # Two directories: "/" reaches .github/workflows, and the composite action has
  # to be named separately -- dependabot does not recurse into
  # .github/actions/*/action.yml, and that file pins six actions of its own. It
  # is also the file CODEOWNERS singles out as able to turn the gate green
  # without running anything, so it is the last one that should go unwatched.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-paintomics"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

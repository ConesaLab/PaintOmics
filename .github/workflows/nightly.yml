# Nightly: every example dataset through the regression harness against
# tests/baseline/. No time limit beyond the runner's own ceiling.
#
# Same environment as the PR gate (.github/actions/setup-paintomics), same
# offline rule. Run it by hand from the Actions tab (workflow_dispatch) after
# changing anything the harness depends on.
#
# Two jobs deliberately break the offline rule, because the thing they test is
# the network path itself:
#
#   installer-smoke  downloads one small species (mge, ~59 pathways, 2 s
#                    between requests) from the live KEGG API. It owns a
#                    scratch mongod on 27777 and a scratch KEGG_DATA tree.
#   llm-gateway      asks the CSIC LLM gateway one eight-token question through
#                    the same client every AI feature uses. It is the ONE job
#                    that holds a secret -- the repository secret
#                    AI_CSIC_API_KEY -- and it needs nothing else: no R, no
#                    MongoDB, no species data. Until it existed the gateway's
#                    only monitor was a user reporting that the AI "does not
#                    work" (llm.iiia.es, 2026-08-21: an hour of accepted
#                    connections and no bytes back).

name: Nightly regression

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: All example datasets against tests/baseline
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-paintomics
      - name: scripts/regression.sh
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci/no_network
          AI_CSIC_API_BASE: http://127.0.0.1:1/v1
          REGRESSION_WORK: ${{ runner.temp }}/regression
        run: scripts/regression.sh
      - name: Keep the differing outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/regression
          retention-days: 14
          if-no-files-found: ignore

  installer-smoke:
    name: Species installer end to end (scratch mongod, live KEGG, mge)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-paintomics
      - name: scripts/ci/installer_smoke.py
        run: >-
          python scripts/ci/installer_smoke.py
          --scratch "${{ runner.temp }}/installer-smoke"
          --seed-common "$PAINTOMICS_KEGG_DATA"
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/installer-smoke/mongod.log
          retention-days: 14
          if-no-files-found: ignore

  llm-gateway:
    name: CSIC LLM gateway answers one question
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: requests
        run: python -m pip install --quiet requests
      # Exit 0 = the pinned model answered, 3 = only a fallback did, 1 = none
      # did, 2 = no key. Everything but 0 fails the job on purpose: a missing
      # secret is a misconfiguration on the main repository, and the pinned
      # model being down is exactly the alert this job exists to raise, even
      # while the fallback keeps the site working.
      - name: src/AdminTools/check_llm_gateway.py
        env:
          AI_CSIC_API_KEY: ${{ secrets.AI_CSIC_API_KEY }}
        working-directory: PaintomicsServer
        run: python src/AdminTools/check_llm_gateway.py --timeout 90

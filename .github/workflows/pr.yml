# Pull-request gate: lint and the client's JavaScript tests, the unit-test
# sweep, the fastest example dataset of each pipeline class through the
# regression harness, a secret scan and a documentation build.
#
# Budget: under 10 minutes wall clock. The five jobs run in parallel, so the
# wall clock is the slowest of them; each has a hard timeout below it. A sixth
# job, `gate`, waits on the other five and is the single status check that
# branch protection on master requires -- see the comment on it below.
#
# No secrets. The pipeline jobs restore the species-data snapshot from the
# Actions cache (seeded by data-cache.yml) and run with outbound networking
# refused (scripts/ci/no_network), so every external API -- KEGG, Reactome,
# PubMed, the LLM gateway behind AI interpretation -- is either stubbed by
# the test or fails loudly.

name: PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: ruff
        run: |
          python -m pip install --quiet ruff==0.14.13
          ruff check --output-format concise .
      - name: Dead-code ratchet (vulture)
        run: |
          python -m pip install --quiet vulture==2.16
          scripts/ci/vulture_gate.sh
      - name: Shell syntax
        run: |
          for script in scripts/*.sh scripts/ci/*.sh deploy/*.sh; do
            bash -n "$script" || exit 1
          done
      # The client is the largest surface in the repository: ruff.toml excludes
      # PaintomicsClient, so for a long time a .js file that no longer parsed
      # reached the browser. `node --check` closed that hole and nothing wider:
      # it answers "does this parse" and has no opinion about what the code then
      # does. ESLint answers both -- an unparseable file is a fatal error, and
      # eslint.config.mjs adds structural-bug rules chosen to be the JavaScript
      # analogue of ruff's `E9, F` (never style). It found four real defects on
      # the tree it was added to, all fixed in that commit: a self-assignment, a
      # block stranded behind a `return`, and two `items:` arrays left with a
      # hole in them by a commented-out entry whose comma stayed.
      #
      # The old grep filter lives in eslint.config.mjs's `ignores` now, with the
      # addition of resources/pyodide -- vendored, and matching none of
      # lib/libs/vendor/extjs/jquery, so `node --check` had been parsing the
      # pyodide runtime on every pull request.
      #
      # Measured: 85 files, 3.4 s, against a Lint job whose worst run is 40 s of
      # a 300 s cap. The version is pinned for the same reason ruff's is.
      - name: Client JavaScript
        run: npx --yes eslint@10.9.1 .
      # PaintomicsClient/tests holds the client's own tests (node:test, no
      # dependencies): the input-format checks, the classification palette and
      # the walk's Results draft. No workflow ran them, so one sat failing on
      # master from 2026-08-27 until this step was added: format-roles.test.js
      # still expected a design-file rule that 20ad645b had removed on purpose.
      # They need only the node this runner already has for ESLint, and take
      # about a second, so they run here rather than in a job of their own.
      # test_client_tests_run_in_ci keeps this step and run.sh's glob honest.
      - name: Client tests
        run: |
          node --version
          sh PaintomicsClient/tests/run.sh
      # "Byte-compile the server" stood here. ruff selects E9 and parses every
      # file compileall did except one -- scripts/ci/vulture_whitelist.py, which
      # ruff.toml excludes because its bare names read as F821 -- so the step
      # was one file away from being pure duplication. That one file is checked
      # here instead, and the duplicate pass over the other 467 is gone.
      - name: The one file ruff does not parse
        run: python -m compileall -q scripts/ci/vulture_whitelist.py
      # `gate` carries a hand-written `needs:` list and branch protection
      # requires only `gate`. A seventh job added below and forgotten there
      # would report success without waiting for it -- the same silent
      # degradation `gate` itself exists to prevent, one level up.
      - name: The gate waits on every job in this workflow
        run: |
          python -m pip install --quiet pyyaml
          python - <<'CHECK'
          import sys, yaml
          jobs = yaml.safe_load(open(".github/workflows/pr.yml"))["jobs"]
          waits_on = set(jobs["gate"].get("needs") or [])
          missing = set(jobs) - waits_on - {"gate"}
          if missing:
              print("::error::gate does not wait on: " + ", ".join(sorted(missing)))
              sys.exit(1)
          print("gate waits on all %d other jobs" % len(waits_on))
          CHECK

  unit-tests:
    # Two shards: the single job crept from 7 to 10 minutes as suites were
    # added and load varied, and timed out at 8068bbba. Each shard carries
    # half the suites and the same per-suite timeout.
    name: Unit tests (offline)
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-paintomics
      - name: Test suites (shard ${{ matrix.shard }})
        # 420 s per suite, under the job's 10-minute cap with the ~110 s of
        # setup taken out. It used to be 600 s -- the whole cap -- so a hung
        # suite was killed by the JOB, and the runner never printed which suite
        # it was nor the results of the others on that shard. 420 s is 1.7x
        # the worst suite observed (249 s, test_compound_name_table_matches_mongo).
        #
        # --slowest 400 prints EVERY suite's duration, not the top 15. The
        # shard split is balanced from scripts/ci/suite_times.txt, and the only
        # honest source for that file is a CI run: a laptop mis-costs it badly
        # (the R-MORE suites cost 113 s locally and nothing here, because they
        # skip). Publishing the whole table makes refreshing it a copy.
        run: >-
          scripts/ci/run-unit-tests.sh --timeout 420 --slowest 400
          --shard "${{ matrix.shard }}"

  fixtures:
    # One dataset per pipeline class, plus one with more than one omic.
    # A field that only a multi-omic job produces is invisible to the
    # single-omic four: 5ca2b7c9 put omicName on every globalExpressionData
    # entry, passed this gate, and left the nightly failing on 02, 03, 04
    # and 08 for two days. 04-multiomics-integration is the cheapest dataset
    # that carries genes and compounds together (~100 s).
    name: Example datasets, one per pipeline class
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-paintomics
      - name: Regression against tests/baseline
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci/no_network
          AI_CSIC_API_BASE: http://127.0.0.1:1/v1
          REGRESSION_WORK: ${{ runner.temp }}/regression
        run: >-
          scripts/regression.sh
          01-gene-single-condition
          04-multiomics-integration
          05-regulatory-mirna
          06-regulatory-more
          07-region-based
      - name: Keep the differing outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/regression
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    # gitleaks over the checked-out tree. Not the history: a full-history scan
    # is minutes per pull request and the history is scanned once, out of band.
    # GitHub's push protection catches provider-pattern secrets before they
    # reach a branch; this catches what a bespoke config would otherwise miss.
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

  docs:
    # mkdocs --strict, so a page that is added to docs/ but left out of the
    # nav, or a link that points at nothing, fails here instead of quietly
    # never appearing on the published site.
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the documentation
        run: |
          python -m pip install --quiet -r docs/mkdocs-pins.txt
          mkdocs build --strict --site-dir "${RUNNER_TEMP}/site"

  gate:
    # One status check for branch protection to require. The unit-test job is a
    # matrix, so its check names carry the shard ("1/2") and change whenever the
    # shard count does -- a ruleset pinned to those names would silently stop
    # gating the moment the matrix is edited. This job's name never changes.
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, unit-tests, fixtures, secret-scan, docs]
    if: always()
    steps:
      - name: Every gate job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::the pull-request gate did not pass (${results})"
              exit 1
            fi
          done

[uwsgi]
wsgi-file = /home/tian/paintomics/paintomics4/paintomics.wsgi

master = true
processes = 1
threads = 4
harakiri = 300
socket-timeout = 300
http-timeout = 300

# Prevent threading/forking deadlocks with APScheduler and background jobs
lazy-apps = true
# Increase socket backlog to handle connection bursts
listen = 500

socket = /tmp/paintomics.sock
logto = /home/tian/paintomics/paintomics_log/uwsgi.log
# uwsgi.log takes the console copy of every application log line (logging.cfg)
# and uWSGI's own lines, and nothing rotated it: it reached 7.7 GB. Past
# log-maxsize the master moves it to log-backupname, replacing the copy moved
# there last time, and opens a new one, so the two files stay near 200 MB.
# application.log rotates on its own (logging.cfg, 15 files of 30 MB).
log-maxsize = 104857600
log-backupname = /home/tian/paintomics/paintomics_log/uwsgi.log.1
chmod-socket = 666
vacuum = true

die-on-term = true

# Secrets (SendGrid API key, AI keys) are NOT loaded here.
#
# uWSGI has no "env-file" option -- the real ones are --env, --envdir and
# --unenv -- and it ignores unknown ini keys silently. A line reading
# "env-file = /etc/paintomics/paintomics.env" therefore looked like working
# configuration for months while delivering nothing: SMTP_PASSWORD stayed empty
# in the workers and every crash report and organism request died with
# "SMTP_PASSWORD is not configured".
#
# The environment file is delivered by systemd instead, which parses KEY=VALUE
# and skips comments natively:
#
#   /etc/systemd/system/paintomics4.service.d/env-file.conf
#   [Service]
#   EnvironmentFile=/etc/paintomics/paintomics.env
#
# Verify with: sudo tr '\0' '\n' < /proc/$(pgrep -f uwsgi | head -1)/environ

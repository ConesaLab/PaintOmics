      - 'Metabolite class activity': '4_5_metabolite_class_activity_analysis.md'
      - 'Regulatory omics (MORE)': '4_6_Regulatory_omics.md'
      - 'Metagenes': '4_7_Metagenes.md'
   - 'Reading a pathway':

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    # The site follows the reader's system theme, with an explicit toggle each
    # way. Both palettes take their accent from the application's own teal.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # Without betterem, python-markdown parses `**bold**` nested inside
  # `*italic*` as a second <em> rather than a <strong>, so every figure
  # caption that names a UI control in bold silently lost it. The
  # captions are written that way throughout, so this is load-bearing.
  - pymdownx.betterem
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

# Pages that must NOT reach the published site. `exclude_docs` is the mechanism
# that actually keeps them off it: `not_in_nav` only drops a page from the
# navigation, and mkdocs still builds and publishes it at its URL, unlinked.
#   - mkdocs-pins.txt is build input, not documentation;
#   - dev/ is maintainer documentation -- deployment procedure and internal
#     traps -- and says on its own first line that it is not for users;
#   - superpowers/ holds the dated design specs;
#   - diagrams/ holds editable .drawio sources referenced by no published page.
#     mkdocs copies every non-markdown file under docs/ verbatim, so without
#     this line all of it would ship to the public site.
exclude_docs: |
   mkdocs-pins.txt
   dev/
   diagrams/
   superpowers/

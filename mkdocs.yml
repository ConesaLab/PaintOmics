site_name: PaintOmics Documentation
site_description: >-
  Documentation for PaintOmics, a web tool for the integrative visualization of
  multiple omic datasets onto KEGG, Reactome, MapMan and OmniPath pathways,
  with an AI agent that drafts an interpretation of the result.
site_url: https://conesalab.github.io/PaintOmics/
repo_url: https://github.com/ConesaLab/PaintOmics
repo_name: ConesaLab/PaintOmics
copyright: PaintOmics is developed by the Conesa Lab and released under the GPL v3.


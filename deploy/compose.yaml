# PaintOmics AI deployment stack.
#
#   nginx  -> TLS termination, static limits, reverse proxy
#   app    -> Flask/uWSGI + the in-process PySiQ job queue
#   mongo  -> MongoDB 7, internal network only
#
# Usage:
#   cp deploy/env.example deploy/.env   # then fill in the secrets
#   docker compose -f deploy/compose.yaml up -d --build

name: paintomics

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # No `ports:` mapping, deliberately. MongoDB has no authentication
    # configured and is reachable only over the internal Compose network.
    # Publishing it would expose an unauthenticated database to the internet.
    networks:
      - internal
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "4"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    environment:
      MONGODB_HOST: mongo
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: PaintomicsDB

      PAINTOMICS_KEGG_DATA: /data/KEGG_DATA
      PAINTOMICS_CLIENT_TMP: /data/CLIENT_TMP

      SERVER_ALLOW_DEBUG: "false"

      # Embedded in activation emails: must be the externally reachable URL.
      PAINTOMICS_BASE_URL: ${PAINTOMICS_BASE_URL:?set PAINTOMICS_BASE_URL in deploy/.env}

      # The mark every outgoing email shows, relative to PAINTOMICS_BASE_URL.
      # serverconf.py has read this from the environment for a while, but the
      # variable was never in this list, so setting it in deploy/.env did
      # nothing -- it never reached the container. The default below is the
      # same one the template carries; override it only to point at a
      # site-specific raster (and it must be a raster: Gmail and Outlook will
      # not render an SVG in an <img>).
      PAINTOMICS_LOGO_PATH: ${PAINTOMICS_LOGO_PATH:-/resources/images/paintomics-mark-email.png}

      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.org}
      SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-apikey}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      AI_INTERPRETATION_ENABLED: ${AI_INTERPRETATION_ENABLED:-true}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-csic}
      AI_CSIC_API_BASE: ${AI_CSIC_API_BASE:-https://llm.iiia.es/v1}
      AI_CSIC_API_KEY: ${AI_CSIC_API_KEY:-}
      AI_CSIC_MODEL: ${AI_CSIC_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
      AI_PUBMED_EMAIL: ${AI_PUBMED_EMAIL:-}
      AI_PUBMED_API_KEY: ${AI_PUBMED_API_KEY:-}
    volumes:
      # Single volume for both trees. On the Drago VM the Docker root lives on
      # the 600 GiB Cinder volume mounted at /var/lib/docker, so this is backed
      # by that disk rather than the 80 GB instance root.
      - paintomics-data:/data
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/paintomics.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    healthcheck:
      # 127.0.0.1, not localhost. In this image localhost resolves to ::1, while
      # nginx's `listen 80` binds IPv4 only -- so the check got "connection
      # refused" on every run and the container sat unhealthy for 18 hours while
      # serving traffic perfectly. A container that is permanently unhealthy
      # while healthy is worse than no healthcheck: it trains you to ignore the
      # status column, and it misleads anything that gates on health.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

networks:
  # A single user-defined bridge. It is NOT marked `internal: true` because the
  # app needs outbound access to rest.kegg.jp, reactome.org, PubMed and the LLM
  # gateway; marking it internal would break the database download entirely.
  #
  # Isolation comes from port publishing instead: nginx is the only service with
  # a `ports:` mapping, so mongo and app are reachable only from inside this
  # network, never from the host or the internet.
  internal:
    driver: bridge
    driver_opts:
      # Must not exceed the host interface MTU. The Drago VM is OpenStack, whose
      # VXLAN overlay gives ens3 an MTU of 1450; Docker defaults its bridges to
      # 1500. Oversized packets are dropped with path-MTU discovery blackholed,
      # so small HTTP responses succeed while large transfers hang and time out.
      #
      # That failure is deceptive: the image build reached deb.debian.org fine
      # and then stalled fetching a 4 MB package index, and it would have
      # stalled again mid-download during the multi-hour KEGG and Reactome
      # fetches. Set /etc/docker/daemon.json to {"mtu": 1450} as well, so the
      # default bridge and `docker build` get it too.
      com.docker.network.driver.mtu: "1450"

volumes:
  paintomics-data:
  mongo-data:
  mongo-config:
  nginx-cache:

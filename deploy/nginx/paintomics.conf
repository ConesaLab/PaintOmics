# PaintOmics AI reverse proxy.
#
# Two numbers here are not free choices -- they must track the application:
#   client_max_body_size  == SERVER_MAX_CONTENT_LENGTH (100 MB)
#   proxy_read_timeout    <= uWSGI harakiri (300s)
# If proxy_read_timeout were shorter, nginx would return 504 while uWSGI was
# still working on a long pathway-acquisition job.

upstream paintomics_app {
    server app:8000;
    keepalive 16;
}

# Plain HTTP: health check and redirect to TLS.
server {
    listen 80;
    server_name _;

    # Kept on HTTP so the container healthcheck does not need the certificate.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/paintomics.crt;
    ssl_certificate_key /etc/nginx/certs/paintomics.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is deliberately NOT set while the certificate is self-signed.
    # Committing browsers to HTTPS-only for a hostname whose certificate they
    # do not trust makes the site unreachable and is hard to undo -- browsers
    # cache the policy. Enable it once a trusted certificate is in place.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Matches SERVER_MAX_CONTENT_LENGTH. Omics uploads are large.
    client_max_body_size 100m;
    client_body_timeout  300s;
    client_body_buffer_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://paintomics_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Must not be shorter than uWSGI's harakiri, or nginx gives up first and
        # the user sees a 504 for a job that is still running.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Job submissions must reach the app as they arrive; buffering the
        # request body delays long uploads for no benefit.
        proxy_request_buffering off;
    }
}

[uwsgi]
# PaintOmics AI uWSGI configuration.

chdir           = /app/PaintomicsServer
wsgi-file       = /app/PaintomicsServer/src/launch_server.py
callable        = app
pythonpath      = /app/PaintomicsServer

http-socket     = 0.0.0.0:8000

# ---------------------------------------------------------------------------
# THE ONE SETTING THAT MUST NOT CHANGE
# ---------------------------------------------------------------------------
# src/common/PySiQ.py is an in-process, thread-backed job queue. It holds all
# job state in the memory of the process that accepted the request. With more
# than one worker process, a job submitted to worker A is invisible to worker B:
# the submitting request succeeds, the status endpoint is served by a process
# that has never heard of the job, and the job appears to hang forever.
#
# Scaling out therefore requires replacing PySiQ with a shared broker. Until
# then, concurrency comes from threads only.
processes       = 1
threads         = 16
enable-threads  = true

# Load the application after fork. The scheduler and queue start threads at
# import time, which do not survive uWSGI's fork when preloading.
lazy-apps       = true

# ---------------------------------------------------------------------------
# Timeouts
# ---------------------------------------------------------------------------
# Pathway acquisition on a large multi-omics dataset is genuinely slow. This
# must stay >= nginx proxy_read_timeout, or nginx returns 504 while uWSGI is
# still working.
harakiri              = 300
harakiri-verbose      = true
http-timeout          = 300
socket-timeout        = 300

# ---------------------------------------------------------------------------
# Limits
# ---------------------------------------------------------------------------
# Matches SERVER_MAX_CONTENT_LENGTH (100 MB) and nginx client_max_body_size.
buffer-size           = 65535
limit-post            = 104857600
post-buffering        = 8192

# ---------------------------------------------------------------------------
# Lifecycle
# ---------------------------------------------------------------------------
master                = true
vacuum                = true
die-on-term           = true
need-app              = true
single-interpreter    = true

# Recycle on memory growth rather than a request count: pathway jobs vary in
# cost by orders of magnitude, so max-requests is a poor proxy for leak
# pressure. reload-on-rss is in MB.
reload-on-rss         = 4096
worker-reload-mercy   = 60

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log-date              = true
disable-logging       = false
log-4xx               = true
log-5xx               = true

	<!-- Theme, resolved before the first paint.
	     Deliberately inline and here rather than in Util.js: the stylesheets
	     above are already parsed at this point, so setting the attribute now
	     means the first frame is drawn in the right theme. Doing it from the
	     application's own start-up instead would paint the whole interface
	     white and then repaint it dark, which is worse than having no dark
	     theme at all for anyone who chose it because light hurts to look at.
	     An explicit choice wins; with no choice stored we follow the operating
	     system, and keep following it while it stays unset. -->
	<script type="text/javascript">
	(function () {
		var stored = null;
		try { stored = window.localStorage.getItem("paintomics-theme"); } catch (e) { /* private mode */ }
		var dark = (stored === "dark") || (stored === null &&
			window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
		if (dark) { document.documentElement.setAttribute("data-theme", "dark"); }
	})();
	</script>

	<!-- A script this page lists that does not arrive is asked for again.
	     app.js's loadModule already retries the views, models and controllers it
	     fetches. These scripts were fetched once by the browser, so a connection
	     that dropped for a moment left the page without one of them: without
	     Util.js the boot error had no dialog to show it in, and the page stayed
	     empty and dark. The browser fires `error` on a script it could not fetch,
	     before it runs the next one, so this listener asks again (synchronously,
	     as loadModule does) and runs the text in its place. A script that still
	     has not arrived after three attempts is named on the page, with a reload
	     button, using nothing but the DOM; app.js then does not boot. Only the
	     page's own scripts, and only until the page has been parsed.

	     A body cut off with no declared length looks whole to the browser: it
	     runs half a file, which does not parse, and fires nothing at the script.
	     A SyntaxError from one of these files is that, and is treated the same. -->
	<script type="text/javascript">
	(function () {
		var ATTEMPTS = 3, PAUSE_MS = 500;   /* as MODULE_FETCH_ATTEMPTS and MODULE_FETCH_RETRY_PAUSE in app.js */
		var failures = window.PA_BOOT_SCRIPT_FAILURES = [];
		var ownOrigin = location.protocol + "//" + location.host + "/";

		function pause(ms) {
			var until = Date.now() + ms;
			while (Date.now() < until) { /* wait: the next script must not run first */ }
		}

		/* A body counts only with a 2xx status, a JavaScript type and text that
		   parses. nginx's 502 page is HTML, and nosniff has the browser refuse that
		   as a script too. new Function parses without running; ExtJS's templates
		   need the same permission of the browser. */
		function fetchScript(url) {
			var request = new XMLHttpRequest();
			try {
				/* Past the HTTP cache, which may hold the copy that was cut off:
				   these addresses are cached for a long time. jQuery does the same
				   for loadModule's requests. */
				request.open("GET", url + (url.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now(), false);
				request.send(null);
			} catch (error) {
				return {status: 0};
			}
			var type = request.getResponseHeader("Content-Type") || "";
			if (!(request.status >= 200 && request.status < 300 && /javascript|ecmascript/i.test(type))) {
				return {status: request.status};
			}
			try {
				new Function(request.responseText);
			} catch (notWhole) {
				if (notWhole instanceof SyntaxError) {
					return {status: 0, cutOff: true};
				}
			}
			return {status: request.status, text: request.responseText};
		}

		/* Asks again and hands the text to `place`, which runs it, or records the
		   file as lost. */
		function askAgain(src, file, place) {
			var answer = {status: 0};
			for (var attempt = 2; attempt <= ATTEMPTS; attempt++) {
				pause(PAUSE_MS * (attempt - 1));
				answer = fetchScript(src);
				if (answer.text !== undefined) {
					var copy = document.createElement("script");
					copy.text = answer.text + "\n//# sourceURL=" + src;
					place(copy);
					return;
				}
			}
			failures.push({file: file, status: answer.status, cutOff: answer.cutOff === true});
		}

		/* Which listed script a SyntaxError on window is about, or "". The parser
		   runs them one at a time, so it is the last one parsed. event.filename
		   checks that, because an async script of another site's could report in
		   between: it is the address, or the name a file gives itself in its first
		   line (Util.js says //# sourceURL=Util.js). */
		function scriptThatDidNotParse(event) {
			var scripts = document.getElementsByTagName("script");
			var src = scripts.length ? scripts[scripts.length - 1].src : "";
			var named = String(event.filename);
			return (src && (named === src || named === src.split("?")[0].split("/").pop())) ? src : "";
		}

		/* The file arrived and does not parse. A file that is wrong on the server
		   ends the same way. The parser is still in the head, so the end of the
		   head is where it stands. */
		function retryCutOff(event) {
			if (!/SyntaxError/.test(String(event.message))) {
				return;
			}
			var src = scriptThatDidNotParse(event);
			if (src.indexOf(ownOrigin) !== 0) {
				return;
			}
			askAgain(src, src.slice(ownOrigin.length).split("?")[0], function (copy) { document.head.appendChild(copy); });
		}

		function retry(event) {
			var script = event.target;
			if (script === window) {
				retryCutOff(event);
				return;
			}
			if (!script || script.tagName !== "SCRIPT" || !script.src || script.src.indexOf(ownOrigin) !== 0) {
				return;
			}
			askAgain(script.src, script.getAttribute("src").split("?")[0], function (copy) {
				script.parentNode.insertBefore(copy, script.nextSibling);
			});
		}

		function paragraph(text) {
			var element = document.createElement("p");
			element.style.margin = "0 0 12px";
			element.appendChild(document.createTextNode(text));
			return element;
		}

		function showFailure() {
			var status = 0, cutOff = false, files = [];
			for (var i = 0; i < failures.length; i++) {
				files.push(failures[i].file);
				status = failures[i].status || status;
				cutOff = cutOff || failures[i].cutOff === true;
			}
			var box = document.createElement("div");
			box.id = "bootScriptFailure";
			box.setAttribute("role", "alert");
			box.style.cssText = "max-width:560px;margin:80px auto;padding:24px 28px;background:#fff;color:#222;" +
				"border:1px solid #ddd;border-top:4px solid #c9302c;border-radius:4px;" +
				"font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;";
			var title = document.createElement("h1");
			title.style.cssText = "font-size:20px;margin:0 0 12px;";
			title.appendChild(document.createTextNode("PaintOmics AI could not start"));
			var cause = paragraph("The page could not finish loading because " +
				(status > 0 ? "the server answered HTTP " + status :
					(cutOff ? "the answer arrived cut off or unreadable" : "the connection dropped")) + " while fetching ");
			var names = document.createElement("b");
			names.appendChild(document.createTextNode(files.join(", ")));
			cause.appendChild(names);
			cause.appendChild(document.createTextNode("."));
			var reload = document.createElement("button");
			reload.type = "button";
			reload.id = "bootScriptFailureReload";
			reload.style.cssText = "font:inherit;padding:6px 14px;margin:0 0 12px;cursor:pointer;";
			reload.appendChild(document.createTextNode("Reload the page"));
			reload.onclick = function () { location.reload(); };
			var contact = paragraph("If it keeps happening, contact us at ");
			var mail = document.createElement("a");
			mail.href = "mailto:paintomicsai@gmail.com";
			mail.appendChild(document.createTextNode("paintomicsai@gmail.com"));
			contact.appendChild(mail);
			contact.appendChild(document.createTextNode("."));
			box.appendChild(title);
			box.appendChild(cause);
			box.appendChild(paragraph("Your analysis and your jobs are not affected."));
			box.appendChild(reload);
			box.appendChild(contact);
			document.body.appendChild(box);
			reload.focus();
		}

		window.addEventListener("error", retry, true);
		document.addEventListener("DOMContentLoaded", function () {
			window.removeEventListener("error", retry, true);
			if (failures.length > 0) {
				showFailure();
			}
		});
	})();
	</script>
